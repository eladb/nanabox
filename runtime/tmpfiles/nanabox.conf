# nanabox tmpfiles (eladb/nanabox#56)
#
# /run is tmpfs, so it's empty after every reboot. This recreates the
# per-agent web-app socket dir on boot. Caddy reverse-proxies /<handle>/* to
# /run/nanabox/agents/<handle>.sock; the agent binds that socket from its own
# systemctl --user service. Mode 2770 root:agents: setgid + group-rwx so any
# member of `agents` (every agent user) can create its own socket here, while
# the world can't. Caddy runs as root and connects to any socket regardless.
d /run/nanabox/agents 2770 root agents
