[Service]
# Caddy runs as root so it can connect to any agent's reverse-proxy socket
# under /run/nanabox/agents/ (mode 2770 root:agents). The box is
# single-tenant; there is no second user to protect from caddy.
User=root
Group=root
# The stock unit ships with ProtectSystem=full (locks /etc read-only) and
# PrivateTmp=true (gives caddy a private /tmp). Disable both so caddy sees the
# real /etc and /tmp on this single-tenant box.
ProtectSystem=false
PrivateTmp=false
